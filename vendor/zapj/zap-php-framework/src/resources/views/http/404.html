<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa; color: #333;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; text-align: center;
        }
        .container { padding: 40px 20px; }
        .code { font-size: 120px; font-weight: 700; color: #d0d7de; line-height: 1; }
        .title { font-size: 28px; font-weight: 600; color: #555; margin-top: 10px; }
        .desc { font-size: 16px; color: #888; margin-top: 12px; max-width: 420px; margin-left: auto; margin-right: auto; }
        .home { display: inline-block; margin-top: 28px; padding: 10px 28px; background: #4078c0; color: #fff; text-decoration: none; border-radius: 6px; font-size: 15px; transition: background .2s; }
        .home:hover { background: #3569a8; }
    </style>
</head>
<body>
    <div class="container">
        <div class="code">404</div>
        <div class="title">页面未找到</div>
        <div class="desc">抱歉，您请求的页面不存在或已被移除。请检查 URL 是否正确。</div>
        <a class="home" href="/">返回首页</a>
    </div>
</body>
</html>
