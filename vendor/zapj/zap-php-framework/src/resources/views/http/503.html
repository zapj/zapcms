<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>503 - 服务暂不可用</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa; color: #333;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; text-align: center;
        }
        .container { padding: 40px 20px; }
        .code { font-size: 120px; font-weight: 700; color: #d0d7de; line-height: 1; }
        .title { font-size: 28px; font-weight: 600; color: #555; margin-top: 10px; }
        .desc { font-size: 16px; color: #888; margin-top: 12px; max-width: 420px; margin-left: auto; margin-right: auto; }
    </style>
</head>
<body>
    <div class="container">
        <div class="code">503</div>
        <div class="title">服务暂不可用</div>
        <div class="desc">服务器正在维护或负载过高，请稍后重试。</div>
    </div>
</body>
</html>
