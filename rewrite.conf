# ============================================================
# ZapCMS  Rewrite Rules
# Nginx & Apache 通用规则
# ============================================================

# ---------------------------- Nginx ----------------------------
# 禁止访问敏感目录
location ~* ^/(app|config|vendor|var|install|mods|\.git|\.idea)/ {
    deny all;
    return 403;
}

# 禁止下载敏感文件
location ~* ^/(composer\.(json|lock)|Dockerfile|console|README\.md|LICENSE|CHANGELOG\.md|\.env|\.env\..*)$ {
    deny all;
    return 403;
}

# 禁止执行 storage/ 下的 PHP，仅允许静态文件
location ^~ /storage/ {
    location ~ \.php$ {
        deny all;
        return 403;
    }
}

# 主路由规则
location / {
    try_files $uri $uri/ /index.php?$query_string;
}
# ----------------------------------------------------------------


# ---------------------------- Apache ----------------------------
# 禁止访问敏感目录
RewriteRule ^(app|config|vendor|var|install|mods|\.git|\.idea)/ - [R=403,L]

# 禁止下载敏感文件
RewriteRule ^(composer\.(json|lock)|Dockerfile|console|README\.md|LICENSE|CHANGELOG\.md|\.env|\.env\..*)$ - [R=403,L]

# 禁止执行 storage/ 下的 PHP
RewriteCond %{REQUEST_URI} ^/storage/
RewriteRule \.php$ - [R=403,L]

# 主路由规则
RewriteCond %{REQUEST_FILENAME} !-d
RewriteCond %{REQUEST_FILENAME} !-f
RewriteRule ^ index.php [QSA,PT,L]
# ----------------------------------------------------------------
